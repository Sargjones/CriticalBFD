name: River logger

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 (UTC); readings post a few minutes late
  workflow_dispatch:
    inputs:
      hours:
        description: "Hours to look back (720 = 30-day backfill)"
        default: "24"

permissions:
  contents: write

concurrency:
  group: river-logger
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Grand River readings
        run: python scripts/poll_river.py --hours "${{ github.event.inputs.hours || '24' }}"

      - name: Commit new readings
        run: |
          git config user.name "criticalbfd-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add river/
          if git diff --cached --quiet; then
            echo "No new readings."
          else
            git commit -m "River log: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --quiet
            git push
          fi
